# lufs-recorder-pwa — website-portability output-branch deploy adapter.
# Tier A pure static: no build. verify (fail-closed) -> package (dist/ + adapters
# + provenance) -> retain off-host -> publish. A red verify never updates `site`.
#
# Runs on the self-hosted lufs fleet (agent-knowledge docs/infra/ci-and-runners/08).
#
# CLOUDFLARE PAGES SETUP (the intended production edge):
#   Production branch: site
#   Build command:     (leave EMPTY)
#   Output directory:  /
#   The `site` branch holds the packaged, verified artifact — Pages must NOT
#   rebuild it (02: a deployment adapter must not compile source again). The
#   generated _headers file rides along in the artifact and Pages applies it.
name: deploy
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: write   # least privilege: only what publishing the output branch needs

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-verify-publish:
    runs-on: [self-hosted, lufs]
    steps:
      # Third-party actions pinned to commit SHAs (KB 02/08 security policy).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      # SYSTEM python3, not actions/setup-python: setup-python has NO arm64 build
      # for our base image and fails outright on the continuo Pis, which take most
      # of these jobs (KB 08 rule 2). The runner image is lean and jobs run as
      # root, so apt-get directly — no sudo. This repo is Tier A: python3 +
      # coreutils are the entire toolchain (verify/package).
      - name: Install build prerequisites (system python3, no sudo)
        run: |
          apt-get update
          apt-get install -y --no-install-recommends python3 ca-certificates
          python3 --version

      - name: Verify source artifact (fail-closed)
        run: bash scripts/verify
      - name: Package release (dist/ + adapters + provenance)
        run: bash scripts/package
      - name: Verify the PACKAGED artifact (what actually ships)
        run: bash scripts/verify dist
      - name: Retain build off-host
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882  # v4.4.3
        with:
          name: lufs-recorder-pwa-dist
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Publish verified output to the site branch
        uses: peaceiris/actions-gh-pages@4f9cc6602d3f66b9c108549d475ec49e8ef4d45e  # v4.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          publish_branch: site
          commit_message: "deploy: ${{ github.sha }}"

# ROLLBACK (KB rule 7): re-run from a known-good SHA (Actions -> Run workflow), or revert
# the `site` branch to its previous deploy commit. Never rebuild old source and call it a
# rollback — redeploy the retained good build.
